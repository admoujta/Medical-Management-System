services:
  backend:
    build:
      context: ./backend
    container_name: fadaa_sante_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/gestion_medical
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8001:8000"
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
    container_name: fadaa_sante_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/gestion_medical
    command: ["python", "-m", "app.workers.lifecycle_worker"]
    volumes:
      - uploads_data:/app/uploads:ro
      - backups_data:/app/backups
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: fadaa_sante_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ""
      VITE_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "5180:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  postgres:
    image: postgres:16
    container_name: fadaa_sante_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_medical
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fadaa_sante_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  uploads_data:
  backups_data:
  frontend_node_modules:
